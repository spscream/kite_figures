# Довоз по расписанию: раз в час запускает catchup.yml.
#
# Зачем отдельный файл. Обычный путь довоза — запуск после Automerge — может
# не сработать: событие потерялось, раннер выката лежал дольше суток, цепочка
# оборвалась посередине. Расписание — страховка на эти случаи. Но воркфлоу с
# расписанием GitHub отключает целиком, если в публичном репозитории 60 дней
# не было активности, — вместе со всеми остальными его триггерами. Стой
# расписание в самом catchup.yml, первый же PR после долгой паузы был бы влит
# и не выкатился. Здесь отключается только этот файл, а довоз после Automerge
# остаётся жить. Включить обратно: Actions → Catch-up schedule → Enable
# workflow.
#
# Интервал — час. Каталог правят несколько раз в день, и обычным путём правка
# доезжает за минуты; расписание нужно только тому, что обычным путём не
# доехало. Каждый заход — одно чтение файла с хоста; чаще стучаться туда
# незачем. Минута не нулевая: в начале часа расписание GitHub запаздывает
# сильнее всего. Оно и так не точное — запуск может опоздать на десятки минут.
#
# Сам этот воркфлоу на хост не ходит и на раннер выката не попадает: он
# запускает catchup.yml событием workflow_dispatch — тем, которым токен
# Actions прогон создать может.
name: Catch-up schedule

on:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Запустить довоз на ветке по умолчанию
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          gh workflow run catchup.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}"
